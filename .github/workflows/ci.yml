name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Bundle size budget
        run: pnpm size
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Vite and webpack 5 consumers
        run: node scripts/consumer-check.mjs

  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      # Skipped until reviewed baselines are committed (see visual-baseline.yml).
      - id: baselines
        run: echo "present=${{ hashFiles('apps/playground/tests/__screenshots__/**') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.baselines.outputs.present == 'true'
        run: apt-get update && apt-get install -y --no-install-recommends fonts-noto-cjk fonts-liberation2 fonts-crosextra-carlito fonts-crosextra-caladea
      - if: steps.baselines.outputs.present == 'true'
        run: npm install -g corepack@latest && corepack enable
      - if: steps.baselines.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.baselines.outputs.present == 'true'
        run: pnpm exec playwright test
        env:
          CI: "1"
          HOME: /root
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            test-results
            playwright-report
